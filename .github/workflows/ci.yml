name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Compilar (se omite mientras no exista src/main.ts)
        run: |
          if [ -f src/main.ts ]; then npm run build; else echo "Aún no hay aplicación que compilar"; fi
